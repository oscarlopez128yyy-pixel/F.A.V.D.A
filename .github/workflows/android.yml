name: Compilar APK FAVDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir FAVDA
        run: unzip -q FAVDA_Android_lista_para_compilar.zip -d source

      - name: Compilar APK
        working-directory: source/FAVDA_Android
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FAVDA-APK
          path: source/FAVDA_Android/app/build/outputs/apk/debug/app-debug.apk
          
