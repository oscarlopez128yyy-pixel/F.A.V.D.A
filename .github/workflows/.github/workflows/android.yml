
name: Compilar APK de FAVDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          unzip -q FAVDA_Android_lista_para_compilar.zip -d source

      - name: Compilar aplicación
        working-directory: source/FAVDA_Android
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FAVDA-apk
          path: source/FAVDA_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
